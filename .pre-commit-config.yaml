# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
      - id: reuse
  - repo: local
    hooks:
      - id: sync-shared
        name: scenario assets in sync with shared/
        entry: tools/sync-shared.sh --check
        language: system
        pass_filenames: false
        files: ^(shared/|usp-core-waap-[^/]+/assets/)
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(shared|tools|local)/.*\.sh$|^local/(kc|runner/kcrc)$
